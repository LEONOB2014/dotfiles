# Personal tmux config — maintained by Andrés Becerra with Claude (Anthropic)
# Catppuccin Mocha theme, matching the ghostty and starship packages

# ===== General =====
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on


# ===== Prefix =====
# Ctrl-a is more ergonomic than the default Ctrl-b, but left disabled since
# Ctrl-a is also the readline "start of line" shortcut used constantly in-shell.
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# Activity and Events
set -g monitor-activity on
set -g visual-activity on


# ===== Splits (keep current path) =====
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ===== Vim-style navigation =====
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ===== Reload =====
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ===== Copy mode (vi) =====
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ===== Plugins =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'

# ===== Catppuccin settings =====
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_status_connect_separator "yes"
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #W"

# Continuum settings
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'
set -g @resurrect-strategy-nvim 'session'

# ===== Initialize TPM =====
run '~/.tmux/plugins/tpm/tpm'

# ===== Simple reliable status bar =====
set -g status-position bottom
set -g status-left-length 100
set -g status-right-length 100

set -g allow-rename off
# Left side - session name
set -g status-left "#[fg=#cba6f7,bg=#1e1e2e] #S #[fg=#1e1e2e,bg=default]"

set-option -g automatic-rename-format '#{pane_current_command}'
set -g status-justify centre

# Right side - CPU + RAM (raw and reliable)
set -g status-right "#[fg=#f9e2af]󰻠 #(~/.tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh) #[fg=#f5c2e7]󰍛 #(~/.tmux/plugins/tmux-cpu/scripts/ram_percentage.sh) "