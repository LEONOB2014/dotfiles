# Personal tmux config — maintained by Andrés Becerra with Claude (Anthropic)
# Flat, minimal status bar — shares its muted grey (#a6adc8) + accent
# (#cba6f7 mauve, from Catppuccin Mocha) with the starship prompt

# ===== General =====
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on


# ===== Prefix =====
# Ctrl-a is more ergonomic than the default Ctrl-b, but left disabled since
# Ctrl-a is also the readline "start of line" shortcut used constantly in-shell.
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# Activity and Events
set -g monitor-activity on
set -g visual-activity on


# ===== Splits (keep current path) =====
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ===== Vim-style navigation =====
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ===== Reload =====
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ===== Copy mode (vi) =====
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ===== Plugins =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Continuum settings
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'
set -g @resurrect-strategy-nvim 'session'

# ===== Initialize TPM =====
run '~/.tmux/plugins/tpm/tpm'

# ===== Status bar (flat, minimal) =====
set -g status-position bottom
set -g status-left-length 100
set -g status-right-length 100
set -g status-justify left
set -g allow-rename off
set-option -g automatic-rename-format '#{pane_current_command}'

# Transparent background, muted grey text — blends with the terminal bg
set -g status-style "bg=default,fg=#a6adc8"

# Left side — session name in the accent color, thin separator
set -g status-left "#[fg=#cba6f7,bold] #S #[fg=#585b70]| "

# Window list — plain text, current window bold in the accent color
set -g window-status-format "#[fg=#a6adc8]#I:#W"
set -g window-status-current-format "#[fg=#cba6f7,bold]#I:#W"
set -g window-status-separator "  "

# Right side — CPU/RAM as plain muted text, then a thin separator and clock
set -g status-right "#[fg=#a6adc8]cpu #(~/.tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh) ram #(~/.tmux/plugins/tmux-cpu/scripts/ram_percentage.sh) #[fg=#585b70]| #[fg=#a6adc8]%H:%M "
